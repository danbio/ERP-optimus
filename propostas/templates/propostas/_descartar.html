<details class="descartar">
  <summary>Descartar este rascunho</summary>
  <form method="post" action="{% url 'propostas:descartar' proposta.pk %}" class="descartar__corpo">
    {% csrf_token %}
    <p>O rascunho será apagado e não volta mais. Use quando o cliente desistiu antes de receber a proposta.</p>
    <button type="submit" class="btn btn--perigo">Sim, descartar</button>
  </form>
</details>
