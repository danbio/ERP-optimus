{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}meu_erp{% endblock %} · Optimus Energia Solar</title>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <img src="{% static 'img/logo-branco.png' %}" alt="Optimus Energia Solar" class="sidebar__logo">
      <a href="{% url 'core:inicio' %}">Início</a>
      <a href="{% url 'propostas:lista' %}">Propostas</a>
      <a href="{% url 'orcamentos:lista' %}">Orçamentos</a>
      <a href="{% url 'orcamentos:catalogo' %}">Catálogo Intelbras</a>
      <a href="#">Clientes</a>
      <a href="#">Configurações</a>
    </nav>
    <div class="conteudo">
      <div class="topbar">
        <h1>{% block titulo_pagina %}{% endblock %}</h1>
      </div>
      {% block conteudo %}{% endblock %}
    </div>
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
