<div class="campo{% if campo.errors %} campo--erro{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" %}
    <label class="campo__opcao" for="{{ campo.id_for_label }}">{{ campo }} {{ campo.label }}</label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="campo__obrigatorio">*</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<p class="ajuda">{{ campo.help_text }}</p>{% endif %}
  {% for erro in campo.errors %}<p class="campo__erro">{{ erro }}</p>{% endfor %}
</div>
